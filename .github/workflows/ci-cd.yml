name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable
      
      - name: Install dependencies
        run: npm ci --no-optional --force
      
      - name: Lint
        run: npm run lint
        working-directory: ./apps/web
      
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          OPENAI_API_KEY: dummy
          STRIPE_SECRET_KEY: dummy
          STRIPE_PRICE_STARTER: dummy
          STRIPE_PRICE_PRO: dummy
          STRIPE_PRICE_AGENCY: dummy
          NEXT_PUBLIC_SITE_URL: http://localhost
          NEXT_DISABLE_TURBOPACK: 1
        run: npm run build
        working-directory: ./apps/web
      
      - name: Run tests
        run: npm test
        continue-on-error: true

  deploy-web:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Skip deploy when Vercel secrets are missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "Skipping Vercel deploy because Vercel secrets are not configured."
      
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'
