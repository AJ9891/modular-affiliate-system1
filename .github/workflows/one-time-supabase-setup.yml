name: One-time Supabase project setup

on:
  push:
    branches:
      - setup/supabase-tooling

permissions:
  contents: write

jobs:
  setup:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/supabase-tooling

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Supabase CLI as project dev dependency
        run: npm install supabase --save-dev

      - name: Install Supabase plugin for Codex at project scope
        run: npx plugins add supabase-community/supabase-plugin --scope project --target codex --yes

      - name: Initialize Supabase if needed
        shell: bash
        run: |
          if [ -f supabase/config.toml ]; then
            echo "Supabase already initialized; leaving existing config in place."
          else
            npx supabase init
          fi

      - name: Show generated changes
        run: git status --short

      - name: Commit setup changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json supabase .codex .agents .mcp.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply Supabase project setup [skip ci]"
            git push origin HEAD:setup/supabase-tooling
          fi
